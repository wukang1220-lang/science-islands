<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 241" role="img">
  <title>父母的基因型都是 Aa，棋盤方格列出子代的四種配對組合。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">棋盤方格法</text>
  <text x="222" y="46" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">Aa（父）</text>
  <text x="57" y="133" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">Aa（母）</text>
  <rect x="150" y="56" width="144" height="116" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <rect x="150" y="56" width="144" height="30" rx="2" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <rect x="105" y="86" width="45" height="86" rx="2" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M222 56V172 M105 129H294" fill="none" stroke="var(--fig-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="222" y="129" width="72" height="43" rx="2" fill="none" stroke="var(--ic)" stroke-width="2"/>
  <text x="186" y="76" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">A</text>
  <text x="258" y="76" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">a</text>
  <text x="127" y="112" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">A</text>
  <text x="127" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">a</text>
  <text x="186" y="112" font-size="14" text-anchor="middle" fill="var(--fig-ink)">AA</text>
  <text x="258" y="112" font-size="14" text-anchor="middle" fill="var(--fig-ink)">Aa</text>
  <text x="186" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)">Aa</text>
  <text x="258" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)">aa</text>
  <rect x="9" y="184" width="342" height="49" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="180" y="203.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">基因型　AA：Aa：aa = 1：2：1</text>
  <text x="180" y="221.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">表現型　顯性：隱性 = 3：1</text>
</svg>
