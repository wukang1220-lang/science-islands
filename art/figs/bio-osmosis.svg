<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" role="img">
  <title>紅血球在清水中膨脹，在生理食鹽水中維持形狀，在濃鹽水中皺縮。</title>
  <defs><marker id="bio-osmosis-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">紅血球與滲透作用</text>
  <rect x="6" y="34" width="114" height="116" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <rect x="123" y="34" width="114" height="116" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <rect x="240" y="34" width="114" height="116" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="63" y="54" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">清水</text>
  <text x="180" y="53" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">生理食鹽水</text>
  <text x="180" y="69" font-size="11" text-anchor="middle" fill="var(--fig-soft)">（約 0.9%）</text>
  <text x="297" y="54" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">濃鹽水</text>
  <ellipse cx="63" cy="97" rx="22" ry="22" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.4"/>
