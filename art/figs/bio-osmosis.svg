  <path d="M200 93H228" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-osmosis-ink)"/>
  <path d="M228 105H200" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-osmosis-ink)"/>
  <path d="M281 99L284 95L283 89L289 90L293 83L298 89L305 85L306 92L313 93L310 99L315 104L308 106L307 112L300 109L296 115L292 109L285 111L286 104Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M282 99H250" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-osmosis-ink)"/>
  <path d="M313 99H344" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-osmosis-ink)"/>
