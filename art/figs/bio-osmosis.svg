  <text x="180" y="140" font-size="12" text-anchor="middle" fill="var(--fig-ink)">形狀不變</text>
  <text x="297" y="140" font-size="12" text-anchor="middle" fill="var(--fig-ink)">皺縮</text>
  <rect x="8" y="161" width="344" height="26" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
