  <text x="200.5" y="155.5" text-anchor="middle" font-size="11" fill="var(--fig-ink)">紅光</text>
  <text x="260" y="155.5" text-anchor="middle" font-size="11" fill="var(--fig-ink)">紅色</text>
  <text x="321" y="155.5" text-anchor="middle" font-size="11" fill="var(--fig-ink)">紅色</text>
  <text x="200.5" y="188.5" text-anchor="middle" font-size="11" fill="var(--fig-ink)">綠光</text>
  <text x="260" y="188.5" text-anchor="middle" font-size="11" fill="var(--fig-ink)">綠色</text>
  <text x="321" y="188.5" text-anchor="middle" font-size="11" fill="var(--fig-ink)">黑色</text>
