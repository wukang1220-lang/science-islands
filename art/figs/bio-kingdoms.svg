<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 219" role="img">
  <title>三個生物界依細胞核、例子及養分來源並列比較。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">原核生物、原生生物和真菌</text>
  <rect x="8" y="34" width="344" height="175" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M13 34H347Q352 34 352 39V67H8V39Q8 34 13 34Z" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 34v175" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M153 34v175" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252 34v175" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="31" y="54.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600"></text>
  <text x="103.5" y="54.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">原核生物界</text>
  <text x="202.5" y="54.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">原生生物界</text>
  <text x="302" y="54.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">真菌界</text>
  <path d="M8 67h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="31" y="90" font-size="12" text-anchor="middle" fill="var(--fig-ink)">細胞核</text>
  <text x="103.5" y="90" font-size="13" text-anchor="middle" fill="var(--fig-ink)">沒有核膜包住</text>
  <text x="202.5" y="90" font-size="13" text-anchor="middle" fill="var(--fig-ink)">有</text>
  <text x="302" y="90" font-size="13" text-anchor="middle" fill="var(--fig-ink)">有</text>
  <path d="M8 105h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="31" y="135" font-size="12" text-anchor="middle" fill="var(--fig-ink)">例子</text>
  <text x="103.5" y="135" font-size="13" text-anchor="middle" fill="var(--fig-ink)">細菌、藍菌</text>
  <text x="202.5" y="127" font-size="13" text-anchor="middle" fill="var(--fig-ink)">草履蟲、眼蟲、</text>
  <text x="202.5" y="143" font-size="13" text-anchor="middle" fill="var(--fig-ink)">藻類</text>
  <text x="302" y="127" font-size="13" text-anchor="middle" fill="var(--fig-ink)">酵母菌、黴菌、</text>
  <text x="302" y="143" font-size="13" text-anchor="middle" fill="var(--fig-ink)">香菇</text>
  <path d="M8 157h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="31" y="187" font-size="12" text-anchor="middle" fill="var(--fig-ink)">養分</text>
  <text x="103.5" y="179" font-size="13" text-anchor="middle" fill="var(--fig-ink)">有的能行</text>
  <text x="103.5" y="195" font-size="13" text-anchor="middle" fill="var(--fig-ink)">光合作用</text>
  <text x="202.5" y="179" font-size="13" text-anchor="middle" fill="var(--fig-ink)">有的能行</text>
  <text x="202.5" y="195" font-size="13" text-anchor="middle" fill="var(--fig-ink)">光合作用</text>
  <text x="302" y="179" font-size="13" text-anchor="middle" fill="var(--fig-ink)">分解或吸收</text>
  <text x="302" y="195" font-size="13" text-anchor="middle" fill="var(--fig-ink)">其他生物的養分</text>
</svg>
