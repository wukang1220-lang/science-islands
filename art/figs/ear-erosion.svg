  <text x="285" y="190" font-size="13" text-anchor="middle" fill="var(--fig-ink)">三角洲</text>
  <rect x="8" y="204" width="344" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.2"/>
