<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img">
  <title>河流上游以侵蝕為主，中游以搬運為主，下游以沉積為主，出山口與河口可見沖積扇和三角洲。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">河流的作用</text>
  <text x="12" y="44" font-size="12" text-anchor="start" fill="var(--fig-ink)">上游：侵蝕為主，V 形谷</text>
  <text x="195" y="68" font-size="12" text-anchor="middle" fill="var(--fig-ink)">中游：搬運</text>
  <text x="309" y="91" font-size="12" text-anchor="middle" fill="var(--fig-ink)">下游：沉積</text>
