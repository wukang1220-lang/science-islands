<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 205" role="img">
  <title>水力發電、火力發電與太陽能板轉換能量的方式不同，轉換前後能量總量保持不變。</title>
  <defs><marker id="phy-conserve-soft" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 3.5L1 6" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">能量的轉換</text>
  <text x="12" y="57" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">水力發電：</text>
  <rect x="79" y="38" width="56" height="28" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="107" y="57" font-size="12" text-anchor="middle" fill="var(--fig-ink)">重力位能</text>
  <path d="M138 52H220" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-conserve-soft)"/>
  <rect x="223" y="38" width="56" height="28" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="251" y="57" font-size="12" text-anchor="middle" fill="var(--fig-ink)">動能</text>
  <path d="M282 52H292" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-conserve-soft)"/>
  <rect x="295" y="38" width="56" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="323" y="57" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電能</text>
  <text x="12" y="99" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">火力發電：</text>
  <rect x="79" y="80" width="56" height="28" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="107" y="99" font-size="12" text-anchor="middle" fill="var(--fig-ink)">化學能</text>
  <path d="M138 94H148" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-conserve-soft)"/>
  <rect x="151" y="80" width="56" height="28" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="179" y="99" font-size="12" text-anchor="middle" fill="var(--fig-ink)">熱能</text>
  <path d="M210 94H220" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-conserve-soft)"/>
  <rect x="223" y="80" width="56" height="28" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="251" y="99" font-size="12" text-anchor="middle" fill="var(--fig-ink)">動能</text>
  <path d="M282 94H292" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-conserve-soft)"/>
  <rect x="295" y="80" width="56" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="323" y="99" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電能</text>
  <text x="12" y="141" font-size="12" text-anchor="start" fill="var(--fig-ink)" font-weight="600">太陽能板：</text>
  <rect x="79" y="122" width="56" height="28" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="107" y="141" font-size="12" text-anchor="middle" fill="var(--fig-ink)">光能</text>
  <path d="M138 136H292" fill="none" stroke="var(--fig-soft)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-conserve-soft)"/>
  <rect x="295" y="122" width="56" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="323" y="141" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電能</text>
  <rect x="8" y="169" width="344" height="28" rx="5" fill="var(--fig-cool)" stroke="var(--ic)" stroke-width="1.6"/>
  <text x="180" y="188" font-size="12" text-anchor="middle" fill="var(--fig-ink)">能量守恆：能量只會轉換形式，總量不變</text>
</svg>
