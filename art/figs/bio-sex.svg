<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 241" role="img">
  <title>母親提供 X，和父親提供的 X 或 Y 配對，形成 XX 或 XY。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">性別的決定</text>
  <text x="222" y="46" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">父親 XY</text>
  <text x="57" y="133" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">母親 XX</text>
  <rect x="150" y="56" width="144" height="116" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <rect x="150" y="56" width="144" height="30" rx="2" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <rect x="105" y="86" width="45" height="86" rx="2" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M222 56V172 M105 129H294" fill="none" stroke="var(--fig-line)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="222" y="56" width="72" height="30" rx="2" fill="none" stroke="var(--ic)" stroke-width="2"/>
  <text x="186" y="76" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">X</text>
  <text x="258" y="76" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">Y</text>
  <text x="127" y="112" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">X</text>
  <text x="127" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">X</text>
  <text x="186" y="112" font-size="14" text-anchor="middle" fill="var(--fig-ink)">XX 女</text>
  <text x="258" y="112" font-size="14" text-anchor="middle" fill="var(--fig-ink)">XY 男</text>
  <text x="186" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)">XX 女</text>
  <text x="258" y="155" font-size="14" text-anchor="middle" fill="var(--fig-ink)">XY 男</text>
  <rect x="9" y="184" width="342" height="49" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="180" y="203.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">卵都帶 X，精子帶 X 或 Y；</text>
  <text x="180" y="221.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">生男、生女的機率各約 50%</text>
</svg>
