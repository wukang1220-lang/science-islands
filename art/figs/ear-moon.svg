  <text x="180" y="232" font-size="12" text-anchor="middle" fill="var(--fig-ink)">日食在初一（月球在日、地之間）；</text>
  <text x="180" y="249" font-size="12" text-anchor="middle" fill="var(--fig-ink)">月食在十五（地球在日、月之間）</text>
