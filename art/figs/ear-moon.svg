  <text x="133" y="43" font-size="12" text-anchor="start" fill="var(--fig-ink)">上弦月（初七、八）</text>
  <circle cx="335" cy="155" r="6" fill="var(--fig-shade)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="323" y="159" font-size="12" text-anchor="end" fill="var(--fig-ink)">新月（初一）</text>
  <circle cx="98" cy="117" r="6" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="88" y="121" font-size="12" text-anchor="end" fill="var(--fig-ink)">滿月（十五）</text>
