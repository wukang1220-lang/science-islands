  <circle cx="180" cy="63" r="9" fill="var(--fig-shade)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <path d="M180 54a9 9 0 0 1 0 18Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="124" cy="119" r="9" fill="var(--fig-shade)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <path d="M124 110a9 9 0 0 1 0 18Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="175" r="9" fill="var(--fig-shade)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <path d="M180 166a9 9 0 0 1 0 18Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
