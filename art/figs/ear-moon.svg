<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img">
  <title>月球向陽的一半始終受光，從地球觀察，會依次看見新月、上弦月、滿月與下弦月。</title>
  <defs><marker id="ear-moon-ic" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="var(--ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ear-moon-ink" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">月相</text>
  <text x="321" y="99" font-size="13" text-anchor="middle" fill="var(--fig-ink)">陽光</text>
  <path d="M348 108h-70" fill="none" stroke="var(--ic)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-moon-ic)"/>
