  <path d="M155 69Q140 77 133 88" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-moon-ink)"/>
  <circle cx="180" cy="119" r="16" fill="var(--fig-sea)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <path d="M167 114l5-7 6 1 4 5-4 4-3 1-2 6-4-5Z M185 124l4-2 4 3-4 5Z" fill="var(--fig-land)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="236" cy="119" r="9" fill="var(--fig-shade)" stroke="var(--fig-ink)" stroke-width="1.4"/>
