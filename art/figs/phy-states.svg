<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" role="img">
  <title>固態、液態與氣態之間的箭頭標示各種狀態變化及其吸熱或放熱情形。</title>
  <defs><marker id="phy-states-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 3.5L1 6" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="phy-states-ic" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 3.5L1 6" fill="none" stroke="var(--ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">三態變化</text>
  <rect x="149" y="38" width="61" height="33" rx="4" fill="var(--fig-cool)" stroke="var(--fig-ink)"/>
  <text x="179.5" y="60" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">氣態</text>
  <rect x="20" y="167" width="61" height="33" rx="4" fill="var(--fig-sand)" stroke="var(--fig-ink)"/>
  <text x="50.5" y="189" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">固態</text>
  <rect x="279" y="167" width="61" height="33" rx="4" fill="var(--fig-sea)" stroke="var(--fig-ink)"/>
  <text x="309.5" y="189" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">液態</text>
  <path d="M63 160L148 74" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-states-ic)"/>
  <path d="M278 155L207 80" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-states-ic)"/>
  <path d="M216 70L298 156" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-states-ink)"/>
  <path d="M86 175H273" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-states-ic)"/>
  <path d="M274 195H86" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-states-ink)"/>
  <text x="66" y="100" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">昇華</text>
  <text x="66" y="117" text-anchor="middle" font-size="11" fill="var(--fig-ink)">吸熱</text>
  <text x="213" y="134" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">汽化</text>
  <text x="213" y="151" text-anchor="middle" font-size="11" fill="var(--fig-ink)">吸熱</text>
  <text x="298" y="94" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">凝結</text>
  <text x="298" y="111" text-anchor="middle" font-size="11" fill="var(--fig-ink)">放熱</text>
  <text x="160" y="168" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">熔化</text>
  <text x="194" y="168" text-anchor="middle" font-size="11" fill="var(--fig-ink)">吸熱</text>
  <text x="160" y="217" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">凝固</text>
  <text x="194" y="217" text-anchor="middle" font-size="11" fill="var(--fig-ink)">放熱</text>
  <rect x="8" y="231" width="344" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)"/>
  <text x="180" y="250" text-anchor="middle" font-size="13" fill="var(--fig-ink)">正在改變狀態時，溫度不變</text>
</svg>
