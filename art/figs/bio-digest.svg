<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
  <title>食物沿消化道從口腔移至肛門，消化腺的分泌物分別流入口腔、胃或小腸。</title>
  <defs><marker id="bio-digest-arr" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
  <text x="180" y="18" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">人體的消化系統</text>
  <path d="M8 26H352" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="109" y="43" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">消化道</text>
  <text x="276" y="43" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">消化腺</text>
  <rect x="86" y="51" width="46" height="20" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
