  <text x="109" y="91" font-size="13" text-anchor="middle" fill="var(--fig-ink)">咽</text>
  <path d="M109 98V103" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="86" y="104" width="46" height="19" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="109" y="117" font-size="13" text-anchor="middle" fill="var(--fig-ink)">食道</text>
  <path d="M109 124V129" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="86" y="130" width="46" height="19" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="109" y="143" font-size="13" text-anchor="middle" fill="var(--fig-ink)">胃</text>
  <path d="M109 150V170" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="86" y="171" width="46" height="34" rx="4" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="2"/>
  <text x="109" y="192" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">小腸</text>
  <path d="M109 206V218" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="86" y="219" width="46" height="22" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="109" y="234" font-size="13" text-anchor="middle" fill="var(--fig-ink)">大腸</text>
  <path d="M109 242V251" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="86" y="252" width="46" height="22" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="109" y="267" font-size="13" text-anchor="middle" fill="var(--fig-ink)">肛門</text>
  <text x="76" y="185" font-size="12" text-anchor="end" fill="var(--fig-soft)">消化、吸收</text>
  <text x="76" y="201" font-size="12" text-anchor="end" fill="var(--fig-soft)">的主要場所</text>
  <text x="76" y="234" font-size="12" text-anchor="end" fill="var(--fig-soft)">吸收水分</text>
