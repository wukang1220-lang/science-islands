  <rect x="204" y="128" width="147" height="22" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="277" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">胃腺：胃液，分解蛋白質</text>
  <path d="M203 139H134" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="216" y="156" width="135" height="22" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="283.5" y="171" font-size="12" text-anchor="middle" fill="var(--fig-ink)">肝臟：膽汁，乳化脂質</text>
  <path d="M215 167H200" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="143" y="153" width="55" height="30" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="170.5" y="166" font-size="12" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">膽囊</text>
  <text x="170.5" y="179" font-size="11" text-anchor="middle" fill="var(--fig-soft)">儲存膽汁</text>
  <path d="M143 175H138V177H134" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="184" y="188" width="167" height="38" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="267.5" y="203" font-size="12" text-anchor="middle" fill="var(--fig-ink)">胰臟：</text>
  <text x="267.5" y="219" font-size="12" text-anchor="middle" fill="var(--fig-ink)">胰液，分解醣類、蛋白質、脂質</text>
  <path d="M183 207H158V188H134" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
  <rect x="204" y="238" width="147" height="24" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="277" y="254" font-size="12" text-anchor="middle" fill="var(--fig-ink)">腸腺：腸液</text>
  <path d="M203 250H146V199H134" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bio-digest-arr)"/>
