<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 278" role="img">
  <title>肺循環由右心室流向肺部再回到左心房，體循環由左心室流向全身再回到右心房。</title>
  <defs><marker id="bio-circulation-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--fig-ink)"/></marker><marker id="bio-circulation-ic" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7Z" fill="var(--ic)"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">人體的血液循環</text>
  <text x="180" y="43" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">肺循環</text>
  <rect x="136" y="49" width="88" height="24" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="180" y="66" font-size="12" text-anchor="middle" fill="var(--fig-ink)">肺部微血管</text>
  <rect x="117" y="108" width="126" height="63" rx="6" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5"/>
  <path d="M180 108V171 M117 139H243" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="128" font-size="13" text-anchor="middle" fill="var(--fig-ink)">右心房</text>
  <text x="211" y="128" font-size="13" text-anchor="middle" fill="var(--fig-ink)">左心房</text>
  <text x="148" y="161" font-size="13" text-anchor="middle" fill="var(--fig-ink)">右心室</text>
  <text x="211" y="161" font-size="13" text-anchor="middle" fill="var(--fig-ink)">左心室</text>
  <path d="M148 132V146" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-circulation-ink)"/>
  <path d="M211 132V146" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-circulation-ink)"/>
  <path d="M116 155H81Q75 144 69 155H34V68Q34 61 41 61H134" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-circulation-ink)"/>
  <path d="M225 61H319Q326 61 326 68V118Q326 123 319 123H245" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-circulation-ink)"/>
  <text x="78" y="81" font-size="13" text-anchor="middle" fill="var(--fig-ink)">肺動脈</text>
  <text x="78" y="99" font-size="11" text-anchor="middle" fill="var(--fig-soft)">缺氧血</text>
  <text x="277" y="81" font-size="13" text-anchor="middle" fill="var(--fig-ink)">肺靜脈</text>
  <text x="277" y="99" font-size="11" text-anchor="middle" fill="var(--fig-soft)">充氧血</text>
  <path d="M245 155H314Q321 155 321 162V221Q321 228 314 228H226" fill="none" stroke="var(--ic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-circulation-ic)"/>
  <rect x="136" y="216" width="88" height="24" rx="5" fill="var(--fig-warm)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="180" y="233" font-size="12" text-anchor="middle" fill="var(--fig-ink)">全身微血管</text>
  <path d="M75 162V147" fill="none" stroke="var(--fig-paper)" stroke-width="5"/>
  <path d="M134 228H82Q75 228 75 221V149" fill="none" stroke="var(--ic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M75 149V130Q75 123 82 123H115" fill="none" stroke="var(--ic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bio-circulation-ic)"/>
  <text x="109" y="189" font-size="13" text-anchor="middle" fill="var(--fig-ink)">大靜脈</text>
  <text x="109" y="207" font-size="11" text-anchor="middle" fill="var(--fig-soft)">缺氧血</text>
  <text x="279" y="189" font-size="13" text-anchor="middle" fill="var(--fig-ink)">主動脈</text>
  <text x="279" y="207" font-size="11" text-anchor="middle" fill="var(--fig-soft)">充氧血</text>
  <text x="180" y="263" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">體循環</text>
</svg>
