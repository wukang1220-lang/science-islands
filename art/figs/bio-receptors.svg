<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" role="img">
  <title>眼、耳、鼻、舌和皮膚接受不同刺激，感覺在大腦產生。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">受器與刺激</text>
  <rect x="8" y="32" width="344" height="163" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M13 32H347Q352 32 352 37V59H8V37Q8 32 13 32Z" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M81 32V195 M225 32V195 M8 59H352 M8 85H352 M8 111H352 M8 137H352 M8 163H352" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="50" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">受器</text>
  <text x="153" y="50" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">接受的刺激</text>
  <text x="288" y="50" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">產生的感覺</text>
  <text x="45" y="77" font-size="13" text-anchor="middle" fill="var(--fig-ink)">眼</text>
  <text x="153" y="77" font-size="13" text-anchor="middle" fill="var(--fig-ink)">光</text>
  <text x="288" y="77" font-size="13" text-anchor="middle" fill="var(--fig-ink)">視覺</text>
  <text x="45" y="103" font-size="13" text-anchor="middle" fill="var(--fig-ink)">耳</text>
  <text x="153" y="103" font-size="13" text-anchor="middle" fill="var(--fig-ink)">聲音</text>
  <text x="288" y="103" font-size="13" text-anchor="middle" fill="var(--fig-ink)">聽覺</text>
  <text x="45" y="129" font-size="13" text-anchor="middle" fill="var(--fig-ink)">鼻</text>
  <text x="153" y="129" font-size="13" text-anchor="middle" fill="var(--fig-ink)">化學物質</text>
  <text x="288" y="129" font-size="13" text-anchor="middle" fill="var(--fig-ink)">嗅覺</text>
  <text x="45" y="155" font-size="13" text-anchor="middle" fill="var(--fig-ink)">舌</text>
  <text x="153" y="155" font-size="13" text-anchor="middle" fill="var(--fig-ink)">化學物質</text>
  <text x="288" y="155" font-size="13" text-anchor="middle" fill="var(--fig-ink)">味覺</text>
  <text x="45" y="184" font-size="13" text-anchor="middle" fill="var(--fig-ink)">皮膚</text>
  <text x="153" y="184" font-size="13" text-anchor="middle" fill="var(--fig-ink)">冷、熱、觸、壓、痛</text>
  <text x="288" y="184" font-size="13" text-anchor="middle" fill="var(--fig-ink)">冷覺、觸覺等</text>
  <rect x="8" y="207" width="344" height="26" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="180" y="224" font-size="12" text-anchor="middle" fill="var(--fig-ink)">受器接受刺激，感覺在大腦產生</text>
</svg>
