<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" role="img">
  <title>能源分為再生與非再生兩類，燃燒化石燃料會排放二氧化碳。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">能源的分類</text>
  <rect x="8" y="33" width="166" height="175" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="182" y="33" width="170" height="175" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="91" y="55" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">再生能源</text>
  <text x="267" y="55" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">非再生能源</text>
  <path d="M20 65h142m32 0h145" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(55 82)">
    <path d="M0-7v-3m0 17v3m-7-10h-3m17 0h3m-15-5-2-2m12 12 2 2m-14 0 2-2m10-10 2-2" fill="none" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4.5" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.2"/>
  </g>
  <text x="79" y="87" text-anchor="start" font-size="13" fill="var(--fig-ink)">太陽能</text>
  <g transform="translate(55 107)">
    <path d="M0 0v9m0-9-2-9q4 1 3 8l8 4q-4 2-9-2l-7 5q0-4 7-7Z" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="1.2" fill="var(--fig-ink)" stroke="none" stroke-width="1.5"/>
  </g>
  <text x="79" y="112" text-anchor="start" font-size="13" fill="var(--fig-ink)">風力</text>
  <g transform="translate(55 132)">
    <path d="M0-9Q-3-3-6 1q-3 7 4 8t8-5q0-5-6-13Z" fill="var(--fig-sea)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="79" y="137" text-anchor="start" font-size="13" fill="var(--fig-ink)">水力</text>
  <g transform="translate(55 157)">
    <path d="M-8 8h16m-13-3q-3-3 0-6t0-6m5 12q-3-3 0-6t0-6m5 12q-3-3 0-6t0-6" fill="none" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="79" y="162" text-anchor="start" font-size="13" fill="var(--fig-ink)">地熱</text>
  <g transform="translate(55 182)">
    <path d="M-6 6Q-10-5 7-8Q8 6-5 6Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-8 9L3-3" fill="none" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="79" y="187" text-anchor="start" font-size="13" fill="var(--fig-ink)">生質能</text>
  <g transform="translate(226 82)">
    <path d="M-8 5l3-10 7-3 7 8-4 7-9 1Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-5-5l4 6 9-1M-1 1l-1 6" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="250" y="87" text-anchor="start" font-size="13" fill="var(--fig-ink)">煤</text>
  <g transform="translate(226 107)">
    <path d="M0-9Q-2-4-6 2q-3 6 4 7t8-5q0-5-6-13Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="250" y="112" text-anchor="start" font-size="13" fill="var(--fig-ink)">石油</text>
  <g transform="translate(226 132)">
    <path d="M-3 9Q-12 4-5-4l1 5q5-3 4-11Q12-1 5 7Q3 10-3 9Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="250" y="137" text-anchor="start" font-size="13" fill="var(--fig-ink)">天然氣</text>
  <g transform="translate(226 157)">
    <path d="M-7-8h4V8h-4ZM1-8h4V8H1Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-9 9H8" fill="none" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="250" y="162" text-anchor="start" font-size="13" fill="var(--fig-ink)">核燃料</text>
  <path d="M204 76h-5v63h5" fill="none" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 109h-8v70h12" fill="none" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="269" y="192" text-anchor="middle" font-size="12" fill="var(--fig-ink)">燃燒化石燃料會排放 CO₂</text>
  <rect x="8" y="217" width="344" height="31" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="180" y="238" text-anchor="middle" font-size="13" fill="var(--fig-ink)">能量守恆：轉換時總量不變，部分變成熱散失</text>
</svg>
