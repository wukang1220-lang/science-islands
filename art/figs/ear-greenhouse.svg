  <text x="302" y="103" text-anchor="middle" font-size="13" fill="var(--fig-ink)">海平面上升</text>
  <text x="302" y="147" text-anchor="middle" font-size="13" fill="var(--fig-ink)">極端天氣增加</text>
  <text x="302" y="191" text-anchor="middle" font-size="13" fill="var(--fig-ink)">珊瑚白化</text>
</svg>
