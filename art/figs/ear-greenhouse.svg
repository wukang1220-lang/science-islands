<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 248" role="img">
  <title>太陽輻射到達地表，溫室氣體吸收地表放出的熱並再放出，使地表保溫。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">溫室效應</text>
  <defs><marker id="ear-greenhouse-ray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ear-greenhouse-heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--ic)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="8" y="32" width="239" height="204" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="253" y="32" width="99" height="204" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="9" y="93" width="237" height="27" rx="0" fill="var(--fig-cool)" stroke="none" stroke-width="1"/>
  <path d="M9 211Q66 206 118 211T246 211V232Q246 235 243 235H12Q9 235 9 232Z" fill="var(--fig-sand)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 211Q66 206 118 211T246 211" fill="none" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(33 57)">
    <circle cx="0" cy="0" r="10" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.5"/>
    <path d="M0 -14v-4M0 14v4M-14 0h-4M14 0h4" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-9 -9l-3-3M9 -9l3-3M-9 9l-3 3M9 9l3 3" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M29 79L58 204" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-greenhouse-ray)"/>
  <path d="M38 78L71 204" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-greenhouse-ray)"/>
  <text x="60" y="59" text-anchor="start" font-size="12" fill="var(--fig-ink)">太陽輻射</text>
  <text x="154" y="110" text-anchor="middle" font-size="11" fill="var(--fig-ink)">溫室氣體（二氧化碳、甲烷、水氣）</text>
  <path d="M112 205C102 196 124 187 113 176S104 160 115 151S106 134 116 122" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-greenhouse-heat)"/>
  <path d="M140 205C130 196 152 187 141 176S132 160 143 151S134 134 144 122" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-greenhouse-heat)"/>
  <path d="M216 92C208 84 230 78 219 68S229 52 223 41" fill="none" stroke="var(--ic)" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ear-greenhouse-heat)"/>
  <path d="M147 122Q167 112 175 125C185 137 163 143 176 154S184 170 175 180S185 193 184 204" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-greenhouse-heat)"/>
  <path d="M201 120C218 122 216 133 210 140S204 151 213 160S218 174 210 182S219 195 219 205" fill="none" stroke="var(--ic)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-greenhouse-heat)"/>
  <text x="87" y="229" text-anchor="middle" font-size="12" fill="var(--fig-ink)">地表放出的熱</text>
  <path d="M122 214l7-8" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="162" y="62" text-anchor="middle" font-size="11" fill="var(--fig-ink)">吸收熱後再放出</text>
