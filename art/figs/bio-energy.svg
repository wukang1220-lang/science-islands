<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 251" role="img">
  <title>能量由生產者往三級消費者逐層減少，大部分以熱的形式散失。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">能量金字塔</text>
  <path d="M78 36H92L108 68H62Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M102 52H176" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="184" y="57" font-size="13" text-anchor="start" fill="var(--fig-ink)">三級消費者　10 kJ</text>
  <path d="M61 72H109L125 104H45Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M119 88H176" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="184" y="93" font-size="13" text-anchor="start" fill="var(--fig-ink)">二級消費者　100 kJ</text>
  <path d="M44 108H126L142 140H28Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M136 124H176" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="184" y="129" font-size="13" text-anchor="start" fill="var(--fig-ink)">初級消費者　1000 kJ</text>
  <path d="M27 144H143L159 176H11Z" fill="var(--fig-land)" stroke="var(--ic)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M153 160H176" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="184" y="165" font-size="13" text-anchor="start" fill="var(--fig-ink)">生產者　10000 kJ</text>
  <rect x="9" y="185" width="342" height="43" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="180" y="201.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">能量逐層減少，大約只剩 10%</text>
  <text x="180" y="219.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">大部分以熱的形式散失</text>
  <text x="348" y="243" font-size="11" text-anchor="end" fill="var(--fig-soft)">數值為示意</text>
</svg>
