  <path d="M62 114l-37 33" fill="none" stroke="var(--fig-soft)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-motor-soft)"/>
  <path d="M62 114h84" fill="none" stroke="var(--ic)" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-motor-ic)"/>
  <circle cx="62" cy="114" r="2.8" fill="var(--fig-ink)" stroke="var(--fig-ink)" stroke-width="1"/>
