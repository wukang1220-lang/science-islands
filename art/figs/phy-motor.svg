  <rect x="318" y="49" width="30" height="64" rx="3" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.5"/>
  <text x="195" y="86" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">N</text>
  <text x="333" y="86" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">S</text>
