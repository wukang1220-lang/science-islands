<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 253" role="img">
  <title>燒杯、量筒、錐形瓶、漏斗、滴管和玻棒各有不同用途與操作方式。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">常用的實驗器材</text>
  <g transform="translate(7 31)">
    <rect x="0" y="0" width="170" height="66" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
    <g transform="translate(3 11)">
    <path d="M4 5l4 5v25q0 3 3 3h21q3 0 3-3V6H4" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 25q6-2 12 0t11 0v11H10Z" fill="var(--fig-sea)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 13h6m-4 6h4" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <text x="47" y="26" text-anchor="start" font-size="14" fill="var(--fig-ink)">燒杯</text>
    <text x="47" y="48" text-anchor="start" font-size="11" fill="var(--fig-ink)">配製溶液，加熱要墊網</text>
  </g>
  <g transform="translate(183 31)">
    <rect x="0" y="0" width="170" height="66" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
    <g transform="translate(3 11)">
    <path d="M13 2h15l-3 4v29h-9V6Z" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 20h7v13h-7Z" fill="var(--fig-sea)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 8h6m-3 5h3m-6 5h6m-3 5h3m-6 5h6" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 35v3h-7v3h18v-3h-7v-3" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <text x="47" y="26" text-anchor="start" font-size="14" fill="var(--fig-ink)">量筒</text>
    <text x="47" y="48" text-anchor="start" font-size="11" fill="var(--fig-ink)">量體積，不可加熱</text>
  </g>
  <g transform="translate(7 103)">
    <rect x="0" y="0" width="170" height="66" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
    <g transform="translate(3 11)">
    <path d="M15 3h12m-11 1v12L5 36q-1 3 3 3h26q4 0 2-3L25 16V4" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 27q4 2 9 0t7 0l5 10H8Z" fill="var(--fig-sea)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <text x="47" y="26" text-anchor="start" font-size="14" fill="var(--fig-ink)">錐形瓶</text>
    <text x="47" y="48" text-anchor="start" font-size="11" fill="var(--fig-ink)">搖晃時不易濺出</text>
  </g>
  <g transform="translate(183 103)">
    <rect x="0" y="0" width="170" height="66" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
    <g transform="translate(3 11)">
    <path d="M3 8h34L23 24v13l-5 3V24Z" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 7l11-6 13 6-12 14Z" fill="var(--fig-cool)" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 3l1 15" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <text x="47" y="26" text-anchor="start" font-size="14" fill="var(--fig-ink)">漏斗</text>
    <text x="47" y="48" text-anchor="start" font-size="11" fill="var(--fig-ink)">搭配濾紙過濾</text>
  </g>
  <g transform="translate(7 175)">
    <rect x="0" y="0" width="170" height="66" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
    <g transform="translate(3 11)">
    <path d="M19 17l-8 20-3 2 1-5 7-19Z" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 15l4-5q0-9 6-9q7-1 7 5t-7 8l-5 5Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7 41q-4 4-1 5t1-5Z" fill="var(--fig-sea)" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <text x="47" y="26" text-anchor="start" font-size="14" fill="var(--fig-ink)">滴管</text>
    <text x="47" y="48" text-anchor="start" font-size="11" fill="var(--fig-ink)">吸取少量液體，不可倒持</text>
  </g>
  <g transform="translate(183 175)">
    <rect x="0" y="0" width="170" height="66" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
    <g transform="translate(3 11)">
    <path d="M7 36L29 3q2-3 4-1t0 4L11 39q-2 3-4 1t0-4Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
    <text x="47" y="26" text-anchor="start" font-size="14" fill="var(--fig-ink)">玻棒</text>
    <text x="47" y="48" text-anchor="start" font-size="11" fill="var(--fig-ink)">攪拌、引流</text>
  </g>
</svg>
