<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 231" role="img">
  <title>歐姆式導體的電壓與電流成正比，燈泡升溫時電阻變大，導線的長度、粗細與溫度也會影響電阻。</title>
  <defs><marker id="phy-ohm-ink" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 3.5L1 6" fill="none" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">歐姆定律與電阻</text>
  <path d="M28 153v-92" fill="none" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-ohm-ink)"/>
  <path d="M28 153h135" fill="none" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-ohm-ink)"/>
  <text x="28" y="53" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電壓</text>
  <text x="157" y="170" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電流</text>
  <path d="M28 153L152 83" fill="none" stroke="var(--ic)" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M28 153C83 148 122 133 152 53" fill="none" stroke="var(--fig-ink)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <path d="M10 190h23" fill="none" stroke="var(--ic)" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="40" y="194" font-size="12" text-anchor="start" fill="var(--fig-ink)">歐姆式導體：V＝I×R</text>
  <path d="M10 212h23" fill="none" stroke="var(--fig-ink)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/>
  <text x="40" y="216" font-size="12" text-anchor="start" fill="var(--fig-ink)">燈泡（電阻隨溫度變大）</text>
  <rect x="177" y="40" width="176" height="130" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <rect x="177" y="40" width="176" height="29" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="265" y="60" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">影響電阻的因素</text>
  <path d="M274 69v101M177 103h176m-176 33h176" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="226" y="91" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">導線愈長</text>
  <text x="314" y="91" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電阻愈大</text>
  <text x="226" y="124" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">導線愈粗</text>
  <text x="314" y="124" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電阻愈小</text>
  <text x="226" y="158" font-size="11.5" text-anchor="middle" fill="var(--fig-ink)">溫度愈高（金屬）</text>
  <text x="314" y="158" font-size="12" text-anchor="middle" fill="var(--fig-ink)">電阻愈大</text>
</svg>
