<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 265" role="img">
  <title>地球剖面分為地殼、地函、外核和內核，板塊邊界有張裂性、聚合性和錯動性三種。</title>
  <defs><marker id="ear-plates-ic" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="var(--ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">地球構造與板塊邊界</text>
  <path d="M17 162V48A114 114 0 0 1 131 162Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 162V53A109 109 0 0 1 126 162Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 162V100A62 62 0 0 1 79 162Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 162V139A23 23 0 0 1 40 162Z" fill="var(--fig-paper)" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 61L83 43H90" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="95" y="47" font-size="12" text-anchor="start" fill="var(--fig-ink)">地殼</text>
  <text x="94" y="124" font-size="12" text-anchor="middle" fill="var(--fig-ink)">地函</text>
  <path d="M62 144l23 34h10" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="99" y="183" font-size="11" text-anchor="start" fill="var(--fig-ink)">外核（液態）</text>
  <path d="M28 154v39h11" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="43" y="198" font-size="11" text-anchor="start" fill="var(--fig-ink)">內核（固態）</text>
  <path d="M174 33V221" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="264" y="47" font-size="12" text-anchor="middle" fill="var(--fig-ink)">張裂性：中洋脊、裂谷</text>
  <path d="M201 76H244L258 68L254 82H201ZM264 68L278 76H328V82H268Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M246 62h-22" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-plates-ic)"/>
  <path d="M278 62h23" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-plates-ic)"/>
  <path d="M185 94H348M185 158H348" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="264" y="110" font-size="12" text-anchor="middle" fill="var(--fig-ink)">聚合性：海溝、島弧、山脈</text>
  <path d="M201 135H247Q257 135 264 141L280 153L277 156L256 143Q252 140 246 140H201Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M261 135L268 137L277 129L284 134L291 124L303 135H328V142H273Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M211 122h28" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-plates-ic)"/>
  <path d="M324 119h-25" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-plates-ic)"/>
  <text x="264" y="176" font-size="12" text-anchor="middle" fill="var(--fig-ink)">錯動性：平移錯開</text>
  <path d="M215 200H308L300 211H207ZM226 187H319L311 198H218Z" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M278 205h-24" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-plates-ic)"/>
  <path d="M254 193h24" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-plates-ic)"/>
  <rect x="8" y="228" width="344" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="180" y="247" font-size="12" text-anchor="middle" fill="var(--fig-ink)">板塊移動的動力：地函的熱對流</text>
</svg>
