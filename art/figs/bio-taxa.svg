<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 269" role="img">
  <title>家犬從界到種的七個分類階層由上而下逐漸縮小。</title>
  <defs><marker id="bio-taxa-arr" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">生物的分類階層</text>
  <rect x="12" y="34" width="139" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="81.5" y="51" font-size="13" text-anchor="middle" fill="var(--fig-ink)">界</text>
  <text x="164" y="51" font-size="13" text-anchor="start" fill="var(--fig-ink)">動物界</text>
  <rect x="19.5" y="66" width="124" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="81.5" y="83" font-size="13" text-anchor="middle" fill="var(--fig-ink)">門</text>
  <text x="164" y="83" font-size="13" text-anchor="start" fill="var(--fig-ink)">脊索動物門</text>
  <rect x="27" y="98" width="109" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="81.5" y="115" font-size="13" text-anchor="middle" fill="var(--fig-ink)">綱</text>
  <text x="164" y="115" font-size="13" text-anchor="start" fill="var(--fig-ink)">哺乳綱</text>
  <rect x="34.5" y="130" width="94" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="81.5" y="147" font-size="13" text-anchor="middle" fill="var(--fig-ink)">目</text>
  <text x="164" y="147" font-size="13" text-anchor="start" fill="var(--fig-ink)">食肉目</text>
  <rect x="42" y="162" width="79" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="81.5" y="179" font-size="13" text-anchor="middle" fill="var(--fig-ink)">科</text>
  <text x="164" y="179" font-size="13" text-anchor="start" fill="var(--fig-ink)">犬科</text>
  <rect x="49.5" y="194" width="64" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="81.5" y="211" font-size="13" text-anchor="middle" fill="var(--fig-ink)">屬</text>
  <text x="164" y="211" font-size="13" text-anchor="start" fill="var(--fig-ink)">犬屬</text>
  <rect x="57" y="226" width="49" height="25" rx="3" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="2"/>
  <text x="81.5" y="243" font-size="13" text-anchor="middle" fill="var(--fig-ink)">種</text>
  <text x="164" y="243" font-size="13" text-anchor="start" fill="var(--fig-ink)">家犬</text>
  <path d="M244 40V249" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#bio-taxa-arr)"/>
  <text x="255" y="126" font-size="13" text-anchor="start" fill="var(--fig-ink)">階層愈小，</text>
  <text x="255" y="149" font-size="13" text-anchor="start" fill="var(--fig-ink)">共同特徵愈多，</text>
  <text x="255" y="172" font-size="13" text-anchor="start" fill="var(--fig-ink)">親緣關係愈近</text>
</svg>
