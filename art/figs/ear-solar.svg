<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 214" role="img">
  <title>八大行星由水星至海王星依序排列，小行星帶位於火星與木星之間。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">太陽系</text>
  <text x="347" y="40" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text>
  <path d="M1 65A37 37 0 0 1 1 139Z" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M29 72l5-6m3 20 7-3m-3 20h7m-11 16 7 3m-17 13 5 5" fill="none" stroke="var(--fig-soft)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="57" cy="103" r="4" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="57" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">水星</text>
  <circle cx="86" cy="103" r="6" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="86" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">金星</text>
  <circle cx="115" cy="103" r="7" fill="var(--fig-sea)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="115" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">地球</text>
  <circle cx="144" cy="103" r="5" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="144" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">火星</text>
  <circle cx="198" cy="103" r="14" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="198" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">木星</text>
  <circle cx="242" cy="103" r="11" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="242" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">土星</text>
  <circle cx="291" cy="103" r="9" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="291" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">天王星</text>
  <circle cx="334" cy="103" r="8" fill="var(--fig-deep)" stroke="var(--fig-ink)" stroke-width="1.4"/>
  <text x="334" y="143" font-size="12" text-anchor="middle" fill="var(--fig-ink)">海王星</text>
  <path d="M185 99q12 4 26 0m-24 8q12 3 23-1" fill="none" stroke="var(--fig-soft)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 98l4 1 1 3-3 1-1 3-4-3Z" fill="var(--fig-land)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 102C218 113 225 116 244 108S268 92 254 95" fill="none" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="166" cy="76" r="1" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="170" cy="83" r="1.4" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="164" cy="89" r="1.5" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="170" cy="95" r="1" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="163" cy="101" r="1.2" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="168" cy="107" r="1.7" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="164" cy="115" r="1.1" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="170" cy="122" r="1.2" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <circle cx="166" cy="128" r="1" fill="var(--fig-soft)" stroke="none" stroke-width="0"/>
  <text x="168" y="62" font-size="12" text-anchor="middle" fill="var(--fig-ink)">小行星帶</text>
  <path d="M168 65v6" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 151v7h116v-7M177 151v7h173v-7" fill="none" stroke="var(--fig-soft)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="97" y="177" font-size="12" text-anchor="middle" fill="var(--fig-ink)">類地行星：岩石、密度大</text>
  <text x="264" y="177" font-size="12" text-anchor="middle" fill="var(--fig-ink)">類木行星：氣體和冰、體積大</text>
  <text x="180" y="203" font-size="11" text-anchor="middle" fill="var(--fig-soft)">大小和距離不按比例</text>
</svg>
