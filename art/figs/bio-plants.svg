<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
  <title>植物界依維管束與種子分支，被子植物再分出雙子葉植物與單子葉植物。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">植物的分類</text>
  <rect x="131" y="28" width="98" height="23" rx="5" fill="var(--fig-land)" stroke="var(--fig-line)" stroke-width="1.4"/>
  <text x="180" y="43.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">植物界</text>
  <path d="M180 52V58H49V64 M180 58H229V64" fill="none" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="49" y="79" font-size="13" text-anchor="middle" fill="var(--fig-ink)">沒有維管束</text>
  <text x="229" y="79" font-size="13" text-anchor="middle" fill="var(--fig-ink)">有維管束</text>
  <path d="M49 84V94 M229 84V90H148V97 M229 90H286V97" fill="none" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="9" y="95" width="80" height="42" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="49" y="111" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">蘚苔植物</text>
  <text x="49" y="128" font-size="12" text-anchor="middle" fill="var(--fig-soft)">地錢</text>
  <text x="148" y="112" font-size="13" text-anchor="middle" fill="var(--fig-ink)">不產生種子</text>
  <text x="286" y="112" font-size="13" text-anchor="middle" fill="var(--fig-ink)">產生種子</text>
  <path d="M148 117V127 M286 117V148H197V177 M286 148V177" fill="none" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="109" y="128" width="77" height="42" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="147.5" y="144" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">蕨類植物</text>
  <text x="147.5" y="161" font-size="12" text-anchor="middle" fill="var(--fig-soft)">用孢子繁殖</text>
  <rect x="153" y="178" width="88" height="51" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="197" y="193" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">裸子植物</text>
  <text x="197" y="209" font-size="12" text-anchor="middle" fill="var(--fig-soft)">種子外沒有果實</text>
  <text x="197" y="224" font-size="12" text-anchor="middle" fill="var(--fig-soft)">松</text>
  <rect x="248" y="178" width="76" height="39" rx="4" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="2"/>
  <text x="286" y="193" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">被子植物</text>
  <text x="286" y="210" font-size="12" text-anchor="middle" fill="var(--fig-soft)">會開花結果</text>
  <path d="M286 218V228H247V236 M286 228H317.5V236" fill="none" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="198" y="237" width="77" height="40" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="236.5" y="253" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">雙子葉植物</text>
  <text x="236.5" y="270" font-size="12" text-anchor="middle" fill="var(--fig-soft)">網狀脈</text>
  <rect x="279" y="237" width="77" height="40" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="317.5" y="253" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">單子葉植物</text>
  <text x="317.5" y="270" font-size="12" text-anchor="middle" fill="var(--fig-soft)">平行脈</text>
</svg>
