<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 215" role="img">
  <title>表格列出長度、質量與時間的 SI 單位及常用換算。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">長度、質量與時間</text>
  <rect x="8" y="33" width="344" height="133" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)"/>
  <rect x="8" y="33" width="344" height="31" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)"/>
  <path d="M63 33V166 M146 33V166 M8 64H352 M8 98H352 M8 132H352" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="35.5" y="52.5" text-anchor="middle" font-size="12" fill="var(--fig-ink)" font-weight="600">物理量</text>
  <text x="104.5" y="52.5" text-anchor="middle" font-size="12" fill="var(--fig-ink)" font-weight="600">SI 單位</text>
  <text x="249" y="52.5" text-anchor="middle" font-size="12" fill="var(--fig-ink)" font-weight="600">常用換算</text>
  <text x="35.5" y="85" text-anchor="middle" font-size="12" fill="var(--fig-ink)">長度</text>
  <text x="104.5" y="85" text-anchor="middle" font-size="12" fill="var(--fig-ink)">公尺（m）</text>
  <text x="249" y="85" text-anchor="middle" font-size="12" fill="var(--fig-ink)">1 km＝1000 m，1 m＝100 cm</text>
  <text x="35.5" y="119" text-anchor="middle" font-size="12" fill="var(--fig-ink)">質量</text>
  <text x="104.5" y="119" text-anchor="middle" font-size="12" fill="var(--fig-ink)">公斤（kg）</text>
  <text x="249" y="119" text-anchor="middle" font-size="12" fill="var(--fig-ink)">1 kg＝1000 g</text>
  <text x="35.5" y="153" text-anchor="middle" font-size="12" fill="var(--fig-ink)">時間</text>
  <text x="104.5" y="153" text-anchor="middle" font-size="12" fill="var(--fig-ink)">秒（s）</text>
  <text x="249" y="153" text-anchor="middle" font-size="12" fill="var(--fig-ink)">1 h＝3600 s</text>
  <rect x="8" y="178" width="344" height="28" rx="4" fill="var(--fig-cool)" stroke="var(--fig-line)"/>
  <text x="180" y="197" text-anchor="middle" font-size="12" fill="var(--fig-ink)">1 m＝1000 mm　1 mm＝1000 μm　1 μm＝1000 nm</text>
</svg>
