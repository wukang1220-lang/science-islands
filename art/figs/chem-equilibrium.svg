<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img">
  <title>正反應與逆反應的速率逐漸接近，達到平衡後以相同的速率持續進行。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="var(--fig-ink)">可逆反應達到平衡</text>
  <text x="11" y="51" text-anchor="start" font-size="12" fill="var(--fig-ink)">反應速率</text>
  <path d="M28 61v129h307 M25 66l3 -5 3 5 M330 187l5 3 -5 3" fill="none" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M173 74V189" fill="none" stroke="var(--fig-soft)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
  <text x="173" y="65" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fig-ink)">達到平衡</text>
  <path d="M28 74C60 79 86 121 128 127C146 130 161 130 173 130H225" fill="none" stroke="var(--ic)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 190C50 182 78 148 113 137C139 130 157 130 173 130H225" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/>
  <text x="70" y="81" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fig-ink)">正反應</text>
  <text x="79" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fig-ink)">逆反應</text>
  <rect x="231" y="108" width="121" height="44" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.2"/>
  <text x="291.5" y="126" text-anchor="middle" font-size="12" fill="var(--fig-ink)">正、逆反應速率相等</text>
  <text x="291.5" y="144" text-anchor="middle" font-size="12" fill="var(--fig-ink)">（動態平衡）</text>
  <text x="334" y="210" text-anchor="end" font-size="12" fill="var(--fig-ink)">時間</text>
  <text x="350" y="233" text-anchor="end" font-size="11" fill="var(--fig-soft)">示意圖</text>
</svg>
