<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 222" role="img">
  <title>表中列出四種 ABO 血型各自可能的基因型。</title>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">ABO 血型</text>
  <rect x="8" y="32" width="344" height="145" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M13 32H347Q352 32 352 37V61H8V37Q8 32 13 32Z" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 32v145" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="50.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">血型</text>
  <text x="232" y="50.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">可能的基因型</text>
  <path d="M8 61h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="79.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">A 型</text>
  <text x="232" y="79.5" font-size="15" text-anchor="middle" fill="var(--fig-ink)">IᴬIᴬ、Iᴬi</text>
  <path d="M8 90h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="108.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">B 型</text>
  <text x="232" y="108.5" font-size="15" text-anchor="middle" fill="var(--fig-ink)">IᴮIᴮ、Iᴮi</text>
  <path d="M8 119h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="137.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">AB 型</text>
  <text x="232" y="137.5" font-size="15" text-anchor="middle" fill="var(--fig-ink)">IᴬIᴮ</text>
  <path d="M8 148h344" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="60" y="166.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">O 型</text>
  <text x="232" y="166.5" font-size="13" text-anchor="middle" fill="var(--fig-ink)">ii</text>
  <rect x="9" y="186" width="342" height="27" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <text x="180" y="203.5" font-size="12" text-anchor="middle" fill="var(--fig-ink)">Iᴬ 和 Iᴮ 對 i 是顯性；Iᴬ、Iᴮ 同時存在時都會表現</text>
</svg>
