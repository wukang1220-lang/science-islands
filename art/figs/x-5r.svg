<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" role="img">
  <title>資源使用以拒絕最優先，其次為減量、重複使用、修理和回收，右側說明酸雨的形成與影響。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">資源使用的 5R</text>
  <defs><marker id="x-5r-priority" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--ic)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <path d="M21 191V51" fill="none" stroke="var(--ic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#x-5r-priority)"/>
  <rect x="37" y="34" width="139" height="29" rx="4" fill="var(--fig-land)" stroke="var(--ic)" stroke-width="1.6"/>
  <text x="106.5" y="54" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">Refuse 拒絕</text>
  <rect x="37" y="69" width="139" height="29" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="106.5" y="89" text-anchor="middle" font-size="13" fill="var(--fig-ink)">Reduce 減量</text>
  <rect x="37" y="104" width="139" height="29" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="106.5" y="124" text-anchor="middle" font-size="13" fill="var(--fig-ink)">Reuse 重複使用</text>
  <rect x="37" y="139" width="139" height="29" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="106.5" y="159" text-anchor="middle" font-size="13" fill="var(--fig-ink)">Repair 修理</text>
  <rect x="37" y="174" width="139" height="29" rx="4" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="106.5" y="194" text-anchor="middle" font-size="13" fill="var(--fig-ink)">Recycle 回收</text>
  <text x="16" y="228" text-anchor="start" font-size="13" fill="var(--fig-ink)">愈上面愈優先</text>
  <rect x="185" y="34" width="167" height="196" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="268.5" y="59" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">酸雨</text>
  <path d="M200 71h137" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268.5" y="98" text-anchor="middle" font-size="12" fill="var(--fig-ink)">二氧化硫、氮氧化物＋雨水 </text>
  <text x="268.5" y="125" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">→ 酸雨（pH＜5.0）</text>
  <path d="M200 145h137" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="268.5" y="174" text-anchor="middle" font-size="12" fill="var(--fig-ink)">會腐蝕大理石、使湖泊酸化</text>
</svg>
