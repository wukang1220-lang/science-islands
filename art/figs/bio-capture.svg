<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 233" role="img">
  <title>先捕捉、標記並放回，再依第二次捕捉樣本的標記比例估算族群總數。</title>
  <defs><marker id="bio-capture-arr" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6Z" fill="var(--fig-ink)"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">捉放法估算族群數量</text>
  <rect x="10" y="32" width="340" height="45" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M84 39v31" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="23" cy="47" r="2.7" fill="var(--fig-ink)"/>
  <ellipse cx="23" cy="47" rx="5.7" ry="5.7" fill="none" stroke="var(--fig-ink)" stroke-width="1"/>
  <circle cx="40" cy="61" r="2.7" fill="var(--fig-ink)"/>
  <ellipse cx="40" cy="61" rx="5.7" ry="5.7" fill="none" stroke="var(--fig-ink)" stroke-width="1"/>
  <circle cx="52" cy="44" r="2.7" fill="var(--fig-ink)"/>
  <ellipse cx="52" cy="44" rx="5.7" ry="5.7" fill="none" stroke="var(--fig-ink)" stroke-width="1"/>
  <circle cx="68" cy="57" r="2.7" fill="var(--fig-ink)"/>
  <ellipse cx="68" cy="57" rx="5.7" ry="5.7" fill="none" stroke="var(--fig-ink)" stroke-width="1"/>
  <text x="96" y="59" font-size="13" text-anchor="start" fill="var(--fig-ink)">① 捕捉 40 隻，做記號後放回</text>
  <path d="M180 79v15" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#bio-capture-arr)"/>
  <rect x="10" y="98" width="340" height="45" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1.3"/>
  <path d="M84 105v31" fill="none" stroke="var(--fig-line)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="23" cy="113" r="2.7" fill="var(--fig-ink)"/>
  <circle cx="40" cy="127" r="2.7" fill="var(--fig-ink)"/>
  <circle cx="52" cy="110" r="2.7" fill="var(--fig-ink)"/>
  <ellipse cx="52" cy="110" rx="5.7" ry="5.7" fill="none" stroke="var(--fig-ink)" stroke-width="1"/>
  <circle cx="68" cy="123" r="2.7" fill="var(--fig-ink)"/>
  <text x="96" y="125" font-size="13" text-anchor="start" fill="var(--fig-ink)">② 再捕捉 50 隻，其中 8 隻有記號</text>
  <path d="M180 145v15" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#bio-capture-arr)"/>
  <rect x="10" y="164" width="340" height="45" rx="5" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="2.2"/>
  <text x="180" y="192" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">③ 族群總數 ≈ 40 × 50 ÷ 8 = 250 隻</text>
  <text x="348" y="225" font-size="11" text-anchor="end" fill="var(--fig-soft)">示意圖</text>
</svg>
