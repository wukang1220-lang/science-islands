  <path d="M295 97V54Q295 45 286 45H227" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-rockcycle-ic)"/>
  <text x="273" y="79" font-size="12" text-anchor="middle" fill="var(--fig-ink)">熔融</text>
  <path d="M109 109H237" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-rockcycle-ic)"/>
  <text x="173" y="102" font-size="12" text-anchor="middle" fill="var(--fig-ink)">高溫高壓</text>
  <path d="M14 132V222Q14 230 22 230H103" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-rockcycle-ic)"/>
