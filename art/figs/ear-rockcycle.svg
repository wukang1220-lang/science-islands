<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 265" role="img">
  <title>岩漿冷卻凝固形成火成岩，岩石可經風化、侵蝕和沉積或高溫高壓轉變，變質岩熔融後又成為岩漿。</title>
  <defs><marker id="ear-rockcycle-ic" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="var(--ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">岩石循環</text>
  <rect x="137" y="31" width="86" height="28" rx="4" fill="var(--fig-warm)" stroke="var(--fig-ink)" stroke-width="1.2"/>
  <text x="180" y="50" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">岩漿</text>
  <rect x="12" y="101" width="93" height="27" rx="4" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.2"/>
  <rect x="242" y="101" width="106" height="27" rx="4" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.2"/>
  <rect x="107" y="217" width="146" height="27" rx="4" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.2"/>
  <text x="58" y="119" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">火成岩</text>
  <text x="295" y="119" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">變質岩</text>
  <text x="180" y="235" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">沉積岩</text>
  <text x="58" y="145" font-size="11" text-anchor="middle" fill="var(--fig-soft)">玄武岩、花岡岩</text>
  <text x="295" y="145" font-size="11" text-anchor="middle" fill="var(--fig-soft)">板岩、片岩、大理岩</text>
  <text x="180" y="259" font-size="11" text-anchor="middle" fill="var(--fig-soft)">礫岩、砂岩、頁岩、石灰岩</text>
  <path d="M133 45H66Q58 45 58 54V97" fill="none" stroke="var(--ic)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-rockcycle-ic)"/>
