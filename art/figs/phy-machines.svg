  <path d="M60 44h46" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M83 21v46" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M66 27l34 34" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M66 61l34 -34" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="83" cy="44" r="9" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5"/>
  <circle cx="83" cy="44" r="2" fill="var(--fig-ink)" stroke="var(--fig-ink)" stroke-width="1"/>
  <path d="M74 44v21M108 44v24" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="66" y="65" width="16" height="9" rx="1" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.2"/>
  <path d="M117 46v19" fill="none" stroke="var(--ic)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-machines-ic)"/>
  <text x="85" y="89" font-size="12" text-anchor="middle" fill="var(--fig-ink)">施力在輪上省力</text>
  </g>
  <rect x="8" y="236" width="344" height="28" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="180" y="255" font-size="12" text-anchor="middle" fill="var(--fig-ink)">省力必費時，不能省功</text>
