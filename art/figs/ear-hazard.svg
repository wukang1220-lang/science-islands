<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" role="img">
  <title>鬆散土石在充足水量與足夠坡度下沿坡流入谷地，植生、擋土牆、排水設施及滯洪池有助水土保持。</title>
