  <rect x="273" y="158" width="80" height="29" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="313" y="177" text-anchor="middle" font-size="12" fill="var(--fig-ink)">肉眼</text>
  <text x="180" y="211" text-anchor="middle" font-size="13" fill="var(--fig-ink)">看遠方的大物體用望遠鏡</text>
  <rect x="7" y="224" width="346" height="28" rx="5" fill="var(--fig-paper)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="180" y="243" text-anchor="middle" font-size="12" fill="var(--fig-ink)">1 km＝1000 m　1 mm＝1000 μm　1 μm＝1000 nm</text>
</svg>
