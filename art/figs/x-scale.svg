<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 259" role="img">
  <title>從奈米到公里每格放大一千倍，圖上標出常見物體的大小與適用的觀察工具。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">從奈米到公里</text>
