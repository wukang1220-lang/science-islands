<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 247" role="img">
  <title>聲音傳到山壁後反射回來，頻帶下方列出超聲波的應用。</title>
  <defs><marker id="phy-echo-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 3.5L1 6" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="phy-echo-ic" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6 3.5L1 6" fill="none" stroke="var(--ic)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">回聲與超聲波</text>
  <ellipse cx="39" cy="59" rx="8" ry="8" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5"/>
  <path d="M34 70q6-4 12 0l5 22-8 2-1 30h-6l-2-30-5 29h-6l5-32Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M40 75l8 10 10-6" fill="none" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M311 42l-9 18 4 13-12 16 5 13-10 22h53V42Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M327 51l-7 13 3 12m-3 16-8 15" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M64 69H303" fill="none" stroke="var(--ic)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-echo-ic)"/>
  <text x="178" y="59" text-anchor="middle" font-size="12" fill="var(--fig-ink)">聲音傳出</text>
  <path d="M298 101H62" fill="none" stroke="var(--fig-ink)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-echo-ink)"/>
  <text x="177" y="121" text-anchor="middle" font-size="12" fill="var(--fig-ink)">反射回來</text>
  <text x="180" y="151" text-anchor="middle" font-size="13" fill="var(--fig-ink)" font-weight="600">距離＝聲速×時間÷2</text>
  <rect x="8" y="165" width="78" height="49" rx="2" fill="var(--fig-paper)" stroke="var(--fig-line)"/>
  <text x="47" y="185" text-anchor="middle" font-size="12" fill="var(--fig-ink)" font-weight="600">低於</text>
  <text x="47" y="204" text-anchor="middle" font-size="12" fill="var(--fig-ink)">20 Hz</text>
  <rect x="86" y="165" width="132" height="49" rx="2" fill="var(--fig-cool)" stroke="var(--fig-line)"/>
  <text x="152" y="185" text-anchor="middle" font-size="12" fill="var(--fig-ink)" font-weight="600">人耳聽得到</text>
  <text x="152" y="204" text-anchor="middle" font-size="12" fill="var(--fig-ink)">20～20000 Hz</text>
  <rect x="218" y="165" width="134" height="49" rx="2" fill="var(--fig-sand)" stroke="var(--fig-line)"/>
  <text x="285" y="185" text-anchor="middle" font-size="12" fill="var(--fig-ink)" font-weight="600">超聲波</text>
  <text x="285" y="204" text-anchor="middle" font-size="12" fill="var(--fig-ink)">高於 20000 Hz</text>
  <text x="349" y="235" text-anchor="end" font-size="12" fill="var(--fig-ink)">蝙蝠、聲納、超音波檢查</text>
</svg>
