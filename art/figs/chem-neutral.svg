  <path d="M112.5 179v4" fill="none" stroke="var(--fig-ink)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="112.5" y="198" font-size="12" text-anchor="middle" fill="var(--fig-ink)">5</text>
  <path d="M187 179v4" fill="none" stroke="var(--fig-ink)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="187" y="198" font-size="12" text-anchor="middle" fill="var(--fig-ink)">10</text>
  <path d="M261.5 179v4" fill="none" stroke="var(--fig-ink)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
