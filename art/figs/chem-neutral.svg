  <path d="M38 168C76 167 130 165 159 156C178 150 183 142 187 108C191 74 195 65 213 59C239 50 290 49 336 48" fill="none" stroke="var(--fig-ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="187" cy="108" r="4" fill="var(--fig-paper)" stroke="var(--ic)" stroke-width="2.3"/>
  <path d="M194 110L207 118H213" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="218" y="123" font-size="13" text-anchor="start" fill="var(--fig-ink)" font-weight="600">恰好中和</text>
  <text x="98" y="145" font-size="12" text-anchor="middle" fill="var(--fig-ink)">酚酞：無色</text>
  <text x="281" y="75" font-size="12" text-anchor="middle" fill="var(--fig-ink)">酚酞：紅色</text>
  <text x="187" y="216" font-size="13" text-anchor="middle" fill="var(--fig-ink)">加入氫氧化鈉的體積（mL）</text>
