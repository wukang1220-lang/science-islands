  <path d="M209 53h25" fill="none" stroke="var(--fig-warm)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M209 53h25" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-currents-main)"/>
  <text x="241" y="58" text-anchor="start" font-size="13" fill="var(--fig-ink)">黑潮（暖流）</text>
