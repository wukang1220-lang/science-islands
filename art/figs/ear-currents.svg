<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 254" role="img">
  <title>黑潮沿臺灣東岸北上，冬季黑潮支流進入海峽南部，中國沿岸流沿海峽西側南下。</title>
  <text x="180" y="20" text-anchor="middle" font-size="14" fill="var(--fig-ink)" font-weight="600">臺灣附近的洋流</text>
  <defs><marker id="ear-currents-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ear-currents-cold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--fig-soft)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ear-currents-branch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L7 4L1 7" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="8" y="33" width="190" height="208" rx="5" fill="var(--fig-sea)" stroke="var(--fig-line)" stroke-width="1"/>
