  <path d="M132 231C134 211 153 196 160 165S173 87 187 48" fill="none" stroke="var(--fig-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ear-currents-main)"/>
  <path d="M140 209C129 200 106 196 100 181S100 152 102 147" fill="none" stroke="var(--fig-warm)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
