  <path d="M154 85Q162 94 153 119Q145 146 122 178Q115 166 118 148Q123 112 154 85Z" fill="var(--fig-land)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
