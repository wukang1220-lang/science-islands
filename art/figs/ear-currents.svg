  <text x="279" y="193" text-anchor="middle" font-size="13" fill="var(--fig-ink)">暖流：低緯 → 高緯</text>
  <text x="279" y="216" text-anchor="middle" font-size="13" fill="var(--fig-ink)">寒流：高緯 → 低緯</text>
  <text x="351" y="243" text-anchor="end" font-size="11" fill="var(--fig-soft)">示意圖</text>
