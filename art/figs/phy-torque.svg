<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
  <title>槓桿平衡時，支點兩側的施力與抗力各乘以對應力臂，所得的力矩大小相等。</title>
  <defs><marker id="phy-torque-ic" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L6.5 3.5L1 6" fill="none" stroke="var(--ic)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text x="180" y="20" font-size="14" text-anchor="middle" fill="var(--fig-ink)" font-weight="600">力矩與槓桿原理</text>
  <text x="67" y="50" font-size="13" text-anchor="middle" fill="var(--fig-ink)">抗力 40 kgw</text>
  <text x="291" y="50" font-size="13" text-anchor="middle" fill="var(--fig-ink)">施力 30 kgw</text>
  <path d="M54 57v49" fill="none" stroke="var(--ic)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-torque-ic)"/>
  <path d="M306 69v37" fill="none" stroke="var(--ic)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#phy-torque-ic)"/>
  <rect x="39" y="108" width="282" height="7" rx="2" fill="var(--fig-sand)" stroke="var(--fig-ink)" stroke-width="1.5"/>
  <path d="M162 115l-13 24h26Z" fill="var(--fig-cool)" stroke="var(--fig-ink)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M145 140h34" fill="none" stroke="var(--fig-soft)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="162" y="158" font-size="12" text-anchor="middle" fill="var(--fig-ink)">支點</text>
  <path d="M54 117v13h89M181 130h125v-13M54 138v-5M306 138v-5" fill="none" stroke="var(--fig-soft)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="102" y="149" font-size="13" text-anchor="middle" fill="var(--fig-ink)">1.5 m</text>
  <text x="235" y="149" font-size="13" text-anchor="middle" fill="var(--fig-ink)">2 m</text>
  <path d="M54 160v7h108v-7m0 7h144v-7" fill="none" stroke="var(--fig-soft)" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="106" y="182" font-size="12" text-anchor="middle" fill="var(--fig-ink)">抗力臂</text>
  <text x="235" y="182" font-size="12" text-anchor="middle" fill="var(--fig-ink)">施力臂</text>
  <rect x="8" y="189" width="344" height="28" rx="5" fill="var(--fig-cool)" stroke="var(--fig-line)" stroke-width="1"/>
  <text x="180" y="208" font-size="12" text-anchor="middle" fill="var(--fig-ink)">施力×施力臂＝抗力×抗力臂　40×1.5＝30×2</text>
</svg>
